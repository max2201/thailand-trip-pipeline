name: Update data
on:
  schedule:
    - cron: "17 1 * * *"   # каждый день в 01:17 UTC (08:17 в Бангкоке и Красноярске); не ровно в :00 — такие запуски GitHub часто пропускает
  workflow_dispatch:
    inputs:
      mode:
        description: "prices, reviews, build или all"
        required: true
        default: all
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py ${{ github.event.inputs.mode || 'all' }}
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A cache site-data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "data: $(date -u +%F)" && git push; fi
